exec standard_mp_shared.cfg

set MQSPQRQQRO 1

set MOLPOSLOMO br
set NKTMKRMSKR br
set RKMMNSQKO mp/loot/br/default/loot_item_defs.csv
set PRRSROQPO "mp/loot/br/default/loot_table_zones.csv" 
set scr_br_gulag 1
set OKTSLRSQMS -1
set MKMQPNOTSN 50
set scr_br_randomstarterloadout 1
set scr_br_altdefaultloadout 1
set scr_player_maxhealth 150

//Just storing this here to remember it for testing so we can use less kits/bots to test squad features
//set RRNTNNKNP 4
set scriptable_force_large_mode 1
set MQNOMMKSMM 1

// This should also be set in br playlists.
set LQLTOQSRNO 0
set LSLMKKNMRS 1
set skydive_enable_parachute_auto_deploy 1

// CClasen - Global playlist dvar to enable powerup UI timers.
set powerup_ui_enabled 1

// Temp work around to bump up weapon map limit in core br 
// We're hitting the limit in mp_br_mechanics
set ROMTTTNL 50
