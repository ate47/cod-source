// This file is where aliens game mode specific stuff should go.  Right now
// this exists in start_up_aliens_mp.cfg, but that stuff really should be moved here.

//set NMROQRRONQ 1
//set MMNMQTSOSP 0

set aim_autoaim_enabled 1
set scr_default_maxagents 32

//Bare bone
set scr_game_allowsupers			1
set scr_game_allowkillstreaks			1
set scr_game_allowperks				1
set scr_war_allowkillstreaks			1
set scr_war_allowsupers				1
set scr_showperksonspawn			1

// reset the reserved scriptable base since it is modified on the playlist
set MTQSLONTSN 400

// reset the scriptable runtime parts limit since it is modified on the playlist
set LTRQKKQMRK 1600

// reset the compass dvars since they are modified on the playlist
set MLNLOPPPK 0
set MPPMSRPRS 0
set MNMRTKRKLL 0