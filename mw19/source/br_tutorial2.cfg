exec br_core.cfg

set NOKSRMNQ 1

set br_minplayers 1
set scr_br_solo_test 1
set MRPPPRMTLO 1 

// Disabling this at it is causing an SRE in mp_br_mechanics
set scr_game_fakeAmortizeNumPlayers 0

// Allow more than four enemy bots at a time
set LNKKRLTPNS 1

// allow special lootset
set PRRSROQPO mp/loot/br/tutorial/loot_table_zones_tutorial2.csv

// This allows the config file to be used in the target-manager when launching front-end
//set wz_tutorial_map mp_br_tut2
//set wz_tutorial_cfg	br_tutorial2.cfg

// Disable all loot boxes except "br_loot_cache_tutorial"
//set MSLKNNLLMN "noSpawn|br_loot_cache|br_loot_cache_lege|brloot_assassination_tablet|brloot_domination_tablet|brloot_scavenger_tablet|brloot_scavenger_tablet_adler|brloot_vip_tablet|brloot_timedrun_tablet|brloot_blueprintextract_tablet|br_loot_cache_zom|br_loot_cache_reddoor|br_loot_cache_pow"

// Don't display "<name> connected" since we spawn bots at run-time and it will confuse the player
set scr_skip_connected_msg_until_time 99999

// Don't allow loadouts in the tutorial (in case someone comes from a playlist that DOES allow loadouts)
set scr_br_allowLoadout 0

// Prevent debug dvars from stepping on the loot contents
set scr_br_debug_loot_name ""
set scr_br_debug_loot_probability 0

// Make sure Solange and player are on the same team
set scr_br_teammaxfill 1

// Disable Armory Trader since it requires string tables that are not loaded by the tutorial
set scr_br_armory_trader 0

// Prevent any hot zone tables from being read by the loot system for the tutorial
set LMSRRONSLK ""